<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom color palette */
        :root {
            --primary-purple: #6f5f90;
            --dark-button: #222222;
            --light-bg: #ffffff;
            --border-color: #8a819b;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Using a local placeholder image that you should replace with a real gym image */
        .login-background {
            background-image: url('https://placehold.co/1200x800/222222/ffffff?text=GYM+BACKGROUND'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .login-card {
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 3rem 4rem;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        .custom-input {
            height: 55px;
            border: 2px solid var(--light-bg);
            border-radius: 8px;
            padding: 0 20px;
            width: 100%;
            outline: none;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            font-weight: 500;
            transition: border-color 0.2s;
        }

        .custom-input:focus {
            border-color: var(--primary-purple);
        }

        .login-button {
            background-color: var(--dark-button);
            color: var(--light-bg);
            padding: 15px 0;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            transition: background-color 0.3s, transform 0.1s;
        }
        
        .login-button:hover {
            background-color: #333333;
        }
        
        .text-link {
            color: #ccc;
            font-size: 12px;
            transition: color 0.2s;
        }

        .text-link:hover {
            color: #fff;
        }

        /* Style for the link to the signup page */
        .signup-link {
            color: var(--primary-purple); /* Highlighted color */
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-900">

    <div class="absolute top-0 left-0 p-4 z-20 text-white font-semibold">Log In</div>

    <div class="login-background">
        <div class="overlay"></div>

        <div class="login-card">
            <h1 class="text-4xl font-bold mb-8 text-white">Sign-in</h1>
            
            <form onsubmit="handleLogin(event)" class="space-y-6">

                <div>
                    <label for="email" class="block text-left text-sm font-medium text-white mb-1">Email<span class="text-red-500">*</span></label>
                    <input type="email" id="email" class="custom-input" placeholder="Enter your email" required>
                </div>

                <div>
                    <label for="password" class="block text-left text-sm font-medium text-white mb-1">Password<span class="text-red-500">*</span></label>
                    <input type="password" id="password" class="custom-input" placeholder="Enter your password" required>
                </div>
                
                <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center">
                        <input id="remember-me" type="checkbox" class="h-4 w-4 bg-gray-700 border-gray-500 rounded text-purple-600 focus:ring-purple-500">
                        <label for="remember-me" class="ml-2 text-xs text-gray-300">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="text-link hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" class="login-button w-full mt-8">
                    Login
                </button>
            </form>

            <div class="mt-6 text-sm text-gray-400">
                Don't have an account? 
                <a href="signup.html" class="signup-link hover:underline">
                    Create an account
                </a>
            </div>
        </div>
    </div>
    
    <div id="message-box" class="fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-xl hidden transition-all duration-300 transform translate-y-full"></div>

   <script>
    // ... (Your showMessage function remains here) ...

    function handleLogin(event) {
        event.preventDefault(); 
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (email.length < 5 || password.length < 4) {
            showMessage("Please enter a valid email and password.", true);
            return;
        }

        // --- SIMULATED LOGIN FOR WORKABLE LINKING ---
        // Successful Login Condition:
        if (email === "admin@test.com" && password === "1234") { 
            const userData = {
                name: "Alex Johnson",
                email: email,
                role: "Senior Manager",
                id: "SM-7790"
            };

            // CRUCIAL: Save User Data to Local Storage
            localStorage.setItem('loggedInUser', JSON.stringify(userData));

            showMessage("Login successful! Redirecting to admin page...");

            // Redirect to admin.html
            setTimeout(() => {
                window.location.href = "admin.html"; 
            }, 1500);

        } else {
            showMessage("Login failed: Invalid email or password.", true);
        }
    }
</script>
</body>
</html>
