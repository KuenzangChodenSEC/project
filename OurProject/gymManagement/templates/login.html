{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom color palette */
        :root {
            --primary-purple: #6f5f90;
            --dark-button: #222222;
            --light-bg: #ffffff;
            --border-color: #8a819b;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        .login-background {
            background-image: url("{% static 'images/Homepage.jpg' %}");
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .login-card {
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 3rem 4rem;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        .custom-input {
            height: 55px;
            border: 2px solid var(--light-bg);
            border-radius: 8px;
            padding: 0 20px;
            width: 100%;
            outline: none;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            font-weight: 500;
            transition: border-color 0.2s;
        }

        .custom-input:focus {
            border-color: var(--primary-purple);
        }

        .login-button {
            background-color: var(--dark-button);
            color: var(--light-bg);
            padding: 15px 0;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            transition: background-color 0.3s, transform 0.1s;
        }
        
        .login-button:hover {
            background-color: #333333;
        }
        
        .text-link {
            color: #ccc;
            font-size: 12px;
            transition: color 0.2s;
        }

        .text-link:hover {
            color: #fff;
        }

        /* Style for the link to the signup page */
        .signup-link {
            color: var(--primary-purple); /* Highlighted color */
            font-weight: 600;
        }

        /* Message Box styles */
        #message-box {
            background-color: white; /* Default color, overwritten by JS */
            color: black; /* Default color, overwritten by JS */
        }
    </style>
</head>
<body class="bg-gray-900">

    <div class="absolute top-0 left-0 p-4 z-20 text-white font-semibold">Log In</div>

    <div class="login-background">
        <div class="overlay"></div>

        <div class="login-card">
            <h1 class="text-4xl font-bold mb-8 text-white">Sign-in</h1>
            
            <form onsubmit="handleLogin(event)" class="space-y-6">

                <div>
                    <label for="email" class="block text-left text-sm font-medium text-white mb-1">Email<span class="text-red-500">*</span></label>
                    <input type="email" id="email" class="custom-input" placeholder="Enter your email" required>
                </div>

                <div>
                    <label for="password" class="block text-left text-sm font-medium text-white mb-1">Password<span class="text-red-500">*</span></label>
                    <input type="password" id="password" class="custom-input" placeholder="Enter your password" required>
                </div>
                
                <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center">
                        <input id="remember-me" type="checkbox" class="h-4 w-4 bg-gray-700 border-gray-500 rounded text-purple-600 focus:ring-purple-500">
                        <label for="remember-me" class="ml-2 text-xs text-gray-300">
                            Remember me
                        </label>
                    </div>
                    <a href="{% url 'forgot_password' %}" class="text-link hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" class="login-button w-full mt-8">
                    Login
                </button>
            </form>

            <div class="mt-6 text-sm text-gray-400">
                Don't have an account? 
                <a href="{% url 'signup' %}" class="signup-link hover:underline">
                    Create an account
                </a>
            </div>
        </div>
    </div>
    
    <div id="message-box" class="fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-xl hidden transition-all duration-300"></div>

    <script>
        function showMessage(message, isError = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = message;
            
            // Set styles based on whether it's an error or success message
            msgBox.style.backgroundColor = isError ? '#dc3545' : '#28a745'; // Red for error, Green for success
            msgBox.style.color = 'white';
            
            // Remove the 'hidden' class to make the box appear
            msgBox.classList.remove('hidden');

            // Hide after a delay
            setTimeout(() => {
                // Add the 'hidden' class back to hide the box
                msgBox.classList.add('hidden');
            }, 4000);
        }

        // Helper function to get the current list of registered users
        function getRegisteredUsers() {
            const usersString = localStorage.getItem('registeredUsers');
            // If the key is missing or empty, return an empty array
            return usersString ? JSON.parse(usersString) : [];
        }

        function handleLogin(event) {
            event.preventDefault(); 
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (email.length < 5 || password.length < 4) {
                showMessage("Please enter a valid email and password.", true);
                return;
            }

            // 1. Load the list of all registered users
            const registeredUsers = getRegisteredUsers();

            // 2. Find the user with the matching email
            const user = registeredUsers.find(u => u.email === email);

            // --- Authentication Logic ---

            if (!user) {
                // Case 1: Email not registered
                showMessage("🚫 Error: Email address is not registered.", true);
                return;
            }

            if (user.password !== password) {
                // Case 2: Email found, but password is incorrect
                showMessage("❌ Error: Incorrect password.", true);
                return;
            }

            // Case 3: Authentication Successful! (Email found AND password matches)
            
            // CRUCIAL: Save the specific user data to the active session key
            // NOTE: We strip the password before saving to the active session for security
            const { password: _, ...userDataForSession } = user;
            localStorage.setItem('loggedInUser', JSON.stringify(userDataForSession));

            showMessage("✅ Login successful! Redirecting to dashboard...", false);

            // Redirect to admin.html (User Dashboard)
            setTimeout(() => {
                window.location.href = "{% url 'admin_page' %}"; 
            }, 1500);
        }

        
    </script>
</body>
</html>
