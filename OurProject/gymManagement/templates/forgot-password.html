{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom color palette */
        :root {
            --primary-purple: #6f5f90;
            --dark-button: #222222;
            --light-bg: #ffffff;
            --border-color: #8a819b;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        .login-background {
            background-image: url('https://placehold.co/1200x800/222222/ffffff?text=GYM+BACKGROUND'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .login-card {
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 3rem 4rem;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        .custom-input {
            height: 55px;
            border: 2px solid var(--light-bg);
            border-radius: 8px;
            padding: 0 20px;
            width: 100%;
            outline: none;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            font-weight: 500;
            transition: border-color 0.2s;
        }

        .custom-input:focus {
            border-color: var(--primary-purple);
        }

        .login-button {
            background-color: var(--dark-button);
            color: var(--light-bg);
            padding: 15px 0;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            transition: background-color 0.3s, transform 0.1s;
        }
        
        .login-button:hover {
            background-color: #333333;
        }
        
        .text-link {
            color: #ccc;
            font-size: 12px;
            transition: color 0.2s;
        }

        .text-link:hover {
            color: #fff;
        }
    </style>
</head>
<body class="bg-gray-900">

    <div class="absolute top-0 left-0 p-4 z-20 text-white font-semibold">Password Reset</div>

    <div class="login-background">
        <div class="overlay"></div>

        <div class="login-card">
            <h1 class="text-3xl font-bold mb-4 text-white">Reset Password</h1>
            <p class="text-gray-300 mb-8 text-sm">Enter your email to search for your account.</p>
            
            <form onsubmit="handleEmailCheck(event)" id="emailCheckForm" class="space-y-6">
                <div>
                    <label for="resetEmail" class="block text-left text-sm font-medium text-white mb-1">Email</label>
                    <input type="email" id="resetEmail" class="custom-input" placeholder="Enter your registered email" required>
                </div>

                <button type="submit" class="login-button w-full">
                    Find Account
                </button>
            </form>

            <form onsubmit="handlePasswordReset(event)" id="passwordResetForm" class="space-y-6 mt-6 hidden">
                <p class="text-gray-300 font-semibold mt-4 text-sm">Account found. Enter new password:</p>
                <div>
                    <label for="newPassword" class="block text-left text-sm font-medium text-white mb-1">New Password</label>
                    <input type="password" id="newPassword" class="custom-input" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-left text-sm font-medium text-white mb-1">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="custom-input" placeholder="Confirm your new password" required>
                </div>

                <button type="submit" class="login-button w-full bg-red-600 hover:bg-red-700">
                    Reset Password
                </button>
            </form>


            <div class="mt-6 text-sm">
                <a href="index.html" class="text-link hover:underline">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
    
    <div id="message-box" class="fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-xl hidden transition-all duration-300"></div>

    <script>
        // Global variable to hold the user object during the reset process
        let targetUser = null; 

        function showMessage(message, isError = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = message;
            
            msgBox.style.backgroundColor = isError ? '#dc3545' : '#28a745'; // Red for error, Green for success
            msgBox.style.color = 'white';
            
            msgBox.classList.remove('hidden');

            setTimeout(() => {
                msgBox.classList.add('hidden');
            }, 4000);
        }

        function getRegisteredUsers() {
            const usersString = localStorage.getItem('registeredUsers');
            return usersString ? JSON.parse(usersString) : [];
        }

        function saveRegisteredUsers(users) {
            localStorage.setItem('registeredUsers', JSON.stringify(users));
        }

        // --- Step 1: Check Email ---
        function handleEmailCheck(event) {
            event.preventDefault();
            
            const email = document.getElementById('resetEmail').value.trim();
            const registeredUsers = getRegisteredUsers();
            
            // Find the user
            const user = registeredUsers.find(u => u.email === email);

            if (!user) {
                showMessage("🚫 Error: Email address not found in our records.", true);
                return;
            }

            // Store the user globally and reveal the password form
            targetUser = user;
            document.getElementById('emailCheckForm').classList.add('hidden');
            document.getElementById('passwordResetForm').classList.remove('hidden');
            showMessage("✅ Account found! Please set a new password.", false);
        }

        // --- Step 2: Reset Password ---
        function handlePasswordReset(event) {
            event.preventDefault();
            
            const newPass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmPassword').value.trim();

            if (newPass.length < 6) {
                showMessage("❌ Error: Password must be at least 6 characters long.", true);
                return;
            }

            if (newPass !== confirmPass) {
                showMessage("❌ Error: New passwords do not match.", true);
                return;
            }

            if (!targetUser) {
                showMessage("❌ Critical Error: User data lost. Please try finding your account again.", true);
                // Force back to email check
                document.getElementById('emailCheckForm').classList.remove('hidden');
                document.getElementById('passwordResetForm').classList.add('hidden');
                return;
            }

            // 1. Load the full user list
            let registeredUsers = getRegisteredUsers();
            const userIndex = registeredUsers.findIndex(u => u.email === targetUser.email);
            
            if (userIndex === -1) {
                showMessage("❌ Error: User data missing from database.", true);
                return;
            }

            // 2. Update the password in the database
            registeredUsers[userIndex].password = newPass;
            saveRegisteredUsers(registeredUsers);

            // 3. Clear session/temp data and redirect
            targetUser = null; 
            
            showMessage("✅ Password reset successfully! Redirecting to login...", false);
            
            setTimeout(() => {
                window.location.href = "index.html"; 
            }, 2000);
        }
    </script>
</body>
</html>
