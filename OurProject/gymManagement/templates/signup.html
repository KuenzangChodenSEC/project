{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-purple: #6f5f90; --dark-button: #222222; }
        body { font-family: 'Poppins', sans-serif; background-color: #f5f5f5; }
        .signup-card { max-width: 450px; }
        .custom-input { height: 45px; border: 1px solid #ccc; border-radius: 6px; padding: 0 15px; width: 100%; outline: none; transition: border-color 0.2s; }
        .custom-input:focus { border-color: var(--primary-purple); }
        .signup-button { background-color: var(--primary-purple); color: white; padding: 12px 0; font-weight: 600; border-radius: 6px; border: none; transition: background-color 0.3s; }
        .signup-button:hover { background-color: #564c70; }
        .login-link { color: var(--primary-purple); font-weight: 600; }
        /* Style for the message box */
        #message-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 1000;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="signup-card bg-white p-8 rounded-xl shadow-2xl w-full">
        <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Admin Sign Up</h1>
        
        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4">
            {% csrf_token %} 
            
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" class="custom-input" placeholder="Enter your full name" required>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="custom-input" placeholder="Enter your email" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="custom-input" placeholder="Create a password" required>
            </div>
            
            <button type="submit" class="signup-button w-full mt-6">
                Register Admin
            </button>
        </form>

        <div class="mt-4 text-sm text-center text-gray-500">
            Already have an account? 
            <a href="{% url 'login' %}" class="login-link hover:underline">
                Log In
            </a>
        </div>
    </div>
    
    <div id="message-box" class="hidden"></div>
    
    <script>
        // --- Utility Functions ---
        function showMessage(message, isError = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = message;
            
            msgBox.style.backgroundColor = isError ? '#dc3545' : '#28a745'; 
            msgBox.classList.remove('hidden');

            setTimeout(() => {
                msgBox.classList.add('hidden');
            }, 4000);
        }

        // Helper function to get the current list of registered users
        function getRegisteredUsers() {
            const usersString = localStorage.getItem('registeredUsers');
            return usersString ? JSON.parse(usersString) : [];
        }

        // Helper function to save the updated list of registered users
        function saveRegisteredUsers(users) {
            localStorage.setItem('registeredUsers', JSON.stringify(users));
        }

        // --- Core Sign Up Logic ---

        async function handleSignup(e) {
            e.preventDefault(); 

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const signupButton = e.submitter;

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters.", true);
                return;
            }

            // Prepare Data for Server
            const newUserData = {
                name: fullName,
                email: email,
                password: password,
                // These are usually handled/generated by the server
                membership: "Trial", 
                userID: "USER" + Math.floor(Math.random() * 9000 + 1000), 
            };
            
            // Disable button during process
            signupButton.disabled = true;
            signupButton.textContent = "Registering...";

            try {
                // --- SIMULATED SERVER LOGIC GOES HERE (REPLACE WITH REAL DJANGO FETCH) ---

                // 1. Simulate server check for duplicate email
                let users = getRegisteredUsers();
                if (users.some(user => user.email === email)) {
                    throw new Error("🚫 This email address is already registered.");
                }

                // 2. Simulate server delay
                await new Promise(resolve => setTimeout(resolve, 500)); 

                // 3. Simulate server saving to database (using localStorage for mock persistence)
                users.push(newUserData);
                saveRegisteredUsers(users);

                // 4. Successful registration (The server would usually create a session/token here)
                
                // 5. Create the active session on this device (Login the user immediately)
                // NOTE: We strip the password from the session data
                const { password: _, ...userDataForSession } = newUserData;
                localStorage.setItem('loggedInUser', JSON.stringify(userDataForSession));
                
                showMessage(`✅ Welcome, ${fullName}! Registration successful. Redirecting...`, false);
                
                // Redirect to the dashboard
                setTimeout(() => {
                    window.location.href = "{% url 'admin_page' %}";
                }, 1500);

            } catch (error) {
                // Handle all errors (duplicate email, network error)
                const errorMessage = error.message.includes('registered') ? error.message : "🚨 Registration failed. Please try again.";
                showMessage(errorMessage, true);
            } finally {
                // Re-enable button
                signupButton.disabled = false;
                signupButton.textContent = "Register Admin";
            }
        }

        document.getElementById('signupForm').addEventListener('submit', handleSignup);
    </script>
</body>
</html>
