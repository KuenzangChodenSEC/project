{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-purple: #6f5f90; --dark-button: #222222; }
        body { font-family: 'Poppins', sans-serif; background-color: #f5f5f5; }
        .signup-card { max-width: 450px; }
        .custom-input { height: 45px; border: 1px solid #ccc; border-radius: 6px; padding: 0 15px; width: 100%; outline: none; transition: border-color 0.2s; }
        .custom-input:focus { border-color: var(--primary-purple); }
        .signup-button { background-color: var(--primary-purple); color: white; padding: 12px 0; font-weight: 600; border-radius: 6px; border: none; transition: background-color 0.3s; }
        .signup-button:hover { background-color: #564c70; }
        .login-link { color: var(--primary-purple); font-weight: 600; }
        /* Style for the message box */
        #message-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 1000;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="signup-card bg-white p-8 rounded-xl shadow-2xl w-full">
        <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Admin Sign Up</h1>
        
        <form id="signupForm" class="space-y-4">
            
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" class="custom-input" placeholder="Enter your full name" required>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="custom-input" placeholder="Enter your email" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="custom-input" placeholder="Create a password" required>
            </div>
            
            <button type="submit" class="signup-button w-full mt-6">
                Register Admin
            </button>
        </form>

        <div class="mt-4 text-sm text-center text-gray-500">
            Already have an account? 
            <a href="{% url 'login' %}" class="login-link hover:underline">
                Log In
            </a>
        </div>
    </div>
    
    <div id="message-box" class="hidden"></div>
    
    <script>
        function showMessage(message, isError = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = message;
            
            // Set styles based on whether it's an error or success message
            msgBox.style.backgroundColor = isError ? '#dc3545' : '#28a745'; 
            msgBox.classList.remove('hidden');

            setTimeout(() => {
                msgBox.classList.add('hidden');
            }, 4000);
        }

        // Helper function to get the current list of registered users
        function getRegisteredUsers() {
            const usersString = localStorage.getItem('registeredUsers');
            return usersString ? JSON.parse(usersString) : [];
        }

        // Helper function to save the updated list of registered users
        function saveRegisteredUsers(users) {
            localStorage.setItem('registeredUsers', JSON.stringify(users));
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (password.length < 6) {
                 showMessage("Password must be at least 6 characters.", true);
                 return;
            }

            // 1. Load existing users
            let users = getRegisteredUsers();

            // 2. CHECK FOR DUPLICATE EMAIL
            const emailExists = users.some(user => user.email === email);
            
            if (emailExists) {
                showMessage("🚫 This email address is already registered.", true);
                return; // Stop the registration process
            }
            
            // 3. Create New User Data
            const initials = fullName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) || 'US';
            const newUserData = {
                name: fullName,
                email: email,
                password: password, // In a real app, this should be hashed!
                membership: "Trial", 
                userID: "USER" + Math.floor(Math.random() * 9000 + 1000), 
                avatarInitials: initials
            };

            // 4. Save the new user to the global list of users
            users.push(newUserData);
            saveRegisteredUsers(users);

            // 5. Create the active session (Login the user immediately)
            localStorage.setItem('loggedInUser', JSON.stringify(newUserData));
            
            showMessage(`✅ Welcome, ${fullName}! Registration successful.`, false);
            
            // Redirect to the dashboard
            setTimeout(() => {
                window.location.href = "{% url 'admin_page' %}";
            }, 1500);
        });
    </script>
</body>
</html>
